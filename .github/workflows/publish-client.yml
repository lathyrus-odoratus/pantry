name: Publish client

on:
  push:
    tags:
      - 'client-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: lets the job mint a short-lived npm token, no NPM_TOKEN secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # trusted publishing needs Node >= 22.14.0
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches client package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/client/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#client-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi
          echo "Tag matches package version: $PKG_VERSION"

      - name: Build (also typechecks)
        run: pnpm build

      - name: Publish to npm
        working-directory: packages/client
        run: npm publish --access public # OIDC auth + provenance happen automatically
