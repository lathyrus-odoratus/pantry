name: Publish client

on:
  push:
    tags:
      - 'client-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches client package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/client/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#client-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi
          echo "Tag matches package version: $PKG_VERSION"

      - name: Build (also typechecks)
        run: pnpm build

      - name: Publish to npm
        working-directory: packages/client
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
