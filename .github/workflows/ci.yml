name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (also typechecks)
        run: pnpm build

      - name: Test
        run: pnpm test

  # main 通過測試後建 backend image 推 ghcr，再打 Dokploy webhook 上線。
  # 沒設 DOKPLOY_WEBHOOK 就只推 image、不部署。說明見 lathyrus-odoratus/dokploy-deploy。
  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: lathyrus-odoratus/dokploy-deploy@v1
        with:
          dockerfile: packages/backend/Dockerfile
          webhook: ${{ secrets.DOKPLOY_WEBHOOK }}
