name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # backend 的 repo 測試（src/db/db.test.ts）要一個用完即丟的 Postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pantry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/pantry_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (also typechecks)
        run: pnpm build

      - name: Test
        run: pnpm test

  # main 通過測試後建 backend image 推 ghcr，再打 Dokploy webhook 上線。
  # 沒設 DOKPLOY_WEBHOOK 就只推 image、不部署。說明見 lathyrus-odoratus/dokploy-deploy。
  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: lathyrus-odoratus/dokploy-deploy@v1
        with:
          dockerfile: packages/backend/Dockerfile
          webhook: ${{ secrets.DOKPLOY_WEBHOOK }}
