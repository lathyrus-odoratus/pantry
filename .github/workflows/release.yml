name: Release backend

# 推 backend-vX.Y.Z tag 時 build image 並部署到 Dokploy。
# 一般 PR merge 進 main 不會部署。發版流程見 CLAUDE.md「Backend」。

on:
  push:
    tags:
      - "backend-v*"

concurrency:
  group: release-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./packages/backend/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#backend-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/backend/package.json version $PKG_VERSION"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - uses: lathyrus-odoratus/dokploy-deploy@v1
        with:
          dockerfile: packages/backend/Dockerfile
          version: ${{ steps.version.outputs.version }}
          webhook: ${{ secrets.DOKPLOY_WEBHOOK }}
